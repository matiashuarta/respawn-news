# Runs on every pull request targeting dev or master.
# 1. Validates Python syntax across all backend files.
# 2. Runs pytest test suite from backend/tests/

name: Run Tests

on:
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Check syntax (all backend files)
        run: |
          python -m py_compile backend/server.py
          python -m py_compile backend/db.py
          python -m py_compile backend/news_data.py
          echo "Syntax OK"

      - name: Run pytest
        run: python -m pytest backend/tests/ -v
